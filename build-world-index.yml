name: Build ASTRA World Knowledge Index

on:
  push:
    paths:
      - "data/v1/batches/**"
      - "tools/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-knowledge-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate immutable batches and rebuild index
        run: python3 tools/build_index.py
      - name: Commit only index changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/world-v1.jsonl knowledge/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "knowledge: rebuild validated world index"
            git push
          fi
